name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite
        run: python -m pytest tests/ -v

      - name: Build knowledge base (BM25 index; dense index best-effort)
        run: python -m scripts.build_knowledge_base

      - name: Run RAG retrieval eval
        run: python -m eval.run_rag_eval

      - name: Train specialist ML risk models
        run: python -m src.ml.train

      - name: Run extraction eval
        run: python -m eval.run_extraction_eval

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mediscan-ai:ci .
